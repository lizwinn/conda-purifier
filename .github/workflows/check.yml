# SPDX-License-Identifier: MIT
#
# Runs every check of the flake: the fixture builds in the Nix sandbox,
# the lockfile reader checks and the formatting check. The aarch64-linux
# checks are evaluated, and built by an aarch64 runner.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - run: nix flake check -L --all-systems --no-build
      - run: nix flake check -L
      # A relock reproduces the lockfile byte for byte. These fixtures pin
      # every package; an environment.yml is solved again against the
      # channels as they are on the day.
      - name: relock the pinned fixtures
        run: |
          nix run .#conda-purifier -- -C tests/fixtures/explicit lock
          nix run .#conda-purifier -- -C tests/fixtures/conda-lock lock
          git diff --exit-code tests/fixtures
